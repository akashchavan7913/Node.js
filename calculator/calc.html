<!DOCTYPE html>
<html lang="en">
<head>
    <title>calculator</title>
    <link rel="stylesheet" href="calc.css">
</head>
<script src="calc.js"></script>
<body>
    <h5 style="margin-left: 40px;"> Akash's Calculator</h5>
    <div style="margin-left: 10px;">
        <input style="text-align: center; width: 80%;"
         type="text" id="inputdata" placeholder="enter number">
    </div><br>
    <div style="margin-left: 30px;">
        <button onclick="btnadd()">+</button>
        <button onclick="btnsub()">-</button>
        <button onclick="btnequ()">=</button>
         </div>
    <div style="margin-left: 30px;">
        <button onclick="btnmul()">*</button>
        <button onclick="btndiv()">/</button>
        <button onclick="btnper()">%</button>
    </div>
    <div style="margin-left: 30px;">
        <button onclick="btn7()">7</button>
        <button onclick="btn8()">8</button>
        <button onclick="btn9()">9</button>
    </div>
    <div style="margin-left: 30px;">
        <button onclick="btn4()">4</button>
        <button onclick="btn5()">5</button>
        <button onclick="btn6()">6</button>
    </div>
    <div style="margin-left: 30px;">
        <button onclick="btn1()">1</button>
        <button onclick="btn2()">2</button>
        <button onclick="btn3()">3</button>
    </div>
    <div style="margin-left: 30px;">
        <button onclick="btn00()">00</button>
        <button onclick="btn0()">0</button>
        <button onclick="btnc()">C</button>
    </div>
</body>
</html>
